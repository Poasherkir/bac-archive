<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم أرشيف البكالوريا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============================= LOGIN VIEW ============================= -->
  <section id="login-view" class="login-view hidden">
    <form id="login-form" class="card login-card" autocomplete="on">
      <h1 class="brand">أرشيف البكالوريا</h1>
      <p class="muted">لوحة تحكم المشرف — شعبة علوم تجريبية</p>

      <label class="field">
        <span>البريد الإلكتروني</span>
        <input type="email" id="login-email" required autocomplete="username" dir="ltr" />
      </label>

      <label class="field">
        <span>كلمة المرور</span>
        <input type="password" id="login-password" required autocomplete="current-password" dir="ltr" />
      </label>

      <button type="submit" id="login-btn" class="btn btn-primary">تسجيل الدخول</button>
      <p id="login-error" class="error hidden"></p>
    </form>
  </section>

  <!-- ============================== APP VIEW ============================== -->
  <section id="app-view" class="app-view hidden">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="dot"></span>
        <span>أرشيف البكالوريا — لوحة التحكم</span>
      </div>
      <div class="topbar-actions">
        <span id="user-email" class="muted" dir="ltr"></span>
        <button id="logout-btn" class="btn btn-ghost">تسجيل الخروج</button>
      </div>
    </header>

    <main class="container">
      <!-- ---------------------- ADD CONTENT FORM ---------------------- -->
      <div class="card form-card">
        <h2 class="section-title">إضافة محتوى جديد</h2>
        <p class="muted small">ارفع ملفات PDF لسنة ومادة معيّنة. يمكنك رفع ملف واحد أو أكثر — والملفات الناقصة تُضاف لاحقًا لنفس الإدخال.</p>

        <form id="add-form">
          <div class="grid-2">
            <label class="field">
              <span>السنة</span>
              <input type="text" id="f-year" inputmode="numeric" placeholder="مثال: 2024" required />
            </label>

            <label class="field">
              <span>المادة</span>
              <select id="f-subject" required></select>
            </label>
          </div>

          <div class="file-grid" id="file-grid">
            <!-- file pickers injected by app.js -->
          </div>

          <div class="form-footer">
            <button type="submit" id="submit-btn" class="btn btn-primary">حفظ ورفع الملفات</button>
            <span id="form-status" class="status"></span>
          </div>

          <div id="progress-wrap" class="progress-wrap hidden">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </form>
      </div>

      <!-- Content management view (Step 3) will mount here -->
      <div id="manage-mount"></div>
    </main>
  </section>

  <!-- Full-screen loader while we resolve the auth session -->
  <div id="boot-loader" class="boot-loader">
    <div class="spinner"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
